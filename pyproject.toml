[project]
name = "pii-privacy-middleware"
version = "0.1.0"
description = "Session-scoped PII protection proxy for LLM requests"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cryptography==48.0.1",
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "litellm>=1.82,<2",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "spacy==3.8.13",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]
ui = [
  "streamlit>=1.53,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
